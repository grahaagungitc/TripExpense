<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Setup - Expense Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#F4F6FA] flex min-h-screen font-sans text-slate-800">

  <!-- SIDEBAR CONTAINER -->
  <div id="sidebarContainer"></div>

  <!-- MAIN CONTENT -->
  <main class="flex-1 p-8 space-y-8 overflow-y-auto">
    <div class="border-b border-slate-200/80 pb-4">
      <h2 class="text-2xl font-black text-amber-600 tracking-tight">Master Setup (Khusus Admin)</h2>
      <p class="text-xs text-slate-400 mt-0.5">Konfigurasi data trip dan pengguna terdaftar</p>
    </div>

    <!-- TRIP SETUP -->
    <section class="bg-white p-7 rounded-[28px] border border-slate-200/70 ui-card-shadow space-y-4">
      <h3 class="text-xs font-bold uppercase text-slate-700 tracking-wider">1. Buat Judul Trip Baru</h3>
      <div class="flex gap-3">
        <input type="text" id="newTripTitle" placeholder="Misal: Outing Bali 2026" class="flex-1 px-4 py-3 text-xs border border-slate-200 rounded-2xl bg-slate-50/50 outline-none">
        <button onclick="handleCreateTrip()" class="px-5 py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-2xl shadow-lg shadow-amber-500/20">Buat Trip</button>
      </div>
      <div id="adminTripList" class="space-y-2 pt-2"></div>
    </section>

    <!-- USER SETUP -->
    <section class="bg-white p-7 rounded-[28px] border border-slate-200/70 ui-card-shadow space-y-4">
      <h3 class="text-xs font-bold uppercase text-slate-700 tracking-wider">2. Tambah User Terdaftar</h3>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <input type="text" id="newUserName" placeholder="Nama Lengkap" class="px-4 py-3 text-xs border border-slate-200 rounded-2xl bg-slate-50/50 outline-none">
        <input type="email" id="newUserEmail" placeholder="email@favehotels.com" class="px-4 py-3 text-xs border border-slate-200 rounded-2xl bg-slate-50/50 outline-none">
        <div class="flex gap-2">
          <select id="newUserRole" class="px-3 py-3 text-xs border border-slate-200 rounded-2xl bg-slate-50/50 outline-none font-bold text-slate-700">
            <option value="USER">USER</option>
            <option value="ADMIN">ADMIN</option>
          </select>
          <button onclick="handleAddUser()" class="flex-1 px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-2xl shadow-lg shadow-blue-500/20">+ Tambah</button>
        </div>
      </div>
      <div id="adminUserList" class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2"></div>
    </section>
  </main>

  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await checkAuthAndProtect(true);
      if (!user) return;

      renderSidebar('setup');
      await loadMasterData();
    });

    async function loadMasterData() {
      const { data: trips } = await db.from('trips').select('*');
      const { data: users } = await db.from('users').select('*');

      document.getElementById('adminTripList').innerHTML = (trips || []).map(t => `
        <div class="p-3 bg-slate-50 border border-slate-200/80 rounded-2xl text-xs flex justify-between items-center font-bold text-slate-800">
          <span>${t.judul}</span>
        </div>
      `).join('');

      document.getElementById('adminUserList').innerHTML = (users || []).map(u => `
        <div class="p-3 bg-slate-50 border border-slate-200/80 rounded-2xl text-xs flex justify-between items-center">
          <div>
            <p class="font-bold text-slate-900">${u.nama} <span class="text-[9px] px-2 py-0.5 bg-blue-100 text-blue-700 rounded-full font-bold ml-1">${u.role}</span></p>
            <p class="text-[10px] text-slate-400 mt-0.5">${u.email}</p>
          </div>
        </div>
      `).join('');
    }

    async function handleCreateTrip() {
      const judul = document.getElementById('newTripTitle').value.trim();
      if (!judul) return alert('Masukkan judul trip!');

      await db.from('trips').insert([{ judul, created_by: currentUser.email }]);
      await db.from('activity_logs').insert([{ user_email: currentUser.email, action: 'CREATE_TRIP', details: `Membuat trip: ${judul}` }]);

      alert('Trip baru dibuat!');
      document.getElementById('newTripTitle').value = '';
      await loadMasterData();
    }

    async function handleAddUser() {
      const nama = document.getElementById('newUserName').value.trim();
      const email = document.getElementById('newUserEmail').value.trim().toLowerCase();
      const role = document.getElementById('newUserRole').value;

      if (!nama || !email) return alert('Lengkapi data user!');

      await db.from('users').insert([{ nama, email, role }]);
      await db.from('activity_logs').insert([{ user_email: currentUser.email, action: 'ADD_USER', details: `Menambahkan user: ${email} (${role})` }]);

      alert('User berhasil ditambahkan!');
      document.getElementById('newUserName').value = '';
      document.getElementById('newUserEmail').value = '';
      await loadMasterData();
    }
  </script>
</body>
</html>
