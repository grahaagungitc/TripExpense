<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Expense Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 flex min-h-screen font-sans">

  <!-- SIDEBAR CONTAINER -->
  <div id="sidebarContainer"></div>

  <!-- MAIN CONTENT -->
  <main class="flex-1 p-8 space-y-6 overflow-y-auto">
    <div class="flex items-center justify-between border-b pb-4 border-slate-200">
      <div>
        <h2 class="text-2xl font-extrabold text-slate-900">Dashboard & Ringkasan Saya</h2>
        <p class="text-xs text-slate-500">Ringkasan kewajiban utang & hak piutang Anda dalam Trip/Event aktif.</p>
      </div>
    </div>

    <!-- SUMMARY UTANG & PIUTANG CARDS -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <!-- CARD PIUTANG (Uang yang harus dibayar orang lain ke saya) -->
      <div class="bg-gradient-to-br from-emerald-500 to-teal-700 text-white p-6 rounded-3xl shadow-lg space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold uppercase tracking-wider text-emerald-100">Total Piutang Saya</span>
          <i class="ri-arrow-down-circle-line text-2xl text-emerald-200"></i>
        </div>
        <p class="text-3xl font-black" id="userTotalPiutang">Rp 0</p>
        <p class="text-[11px] text-emerald-100">Total uang yang harus dibayarkan anggota lain kepada Anda.</p>
      </div>

      <!-- CARD UTANG (Uang yang harus saya bayar ke orang lain) -->
      <div class="bg-gradient-to-br from-rose-500 to-red-700 text-white p-6 rounded-3xl shadow-lg space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold uppercase tracking-wider text-rose-100">Total Utang Saya</span>
          <i class="ri-arrow-up-circle-line text-2xl text-rose-200"></i>
        </div>
        <p class="text-3xl font-black" id="userTotalUtang">Rp 0</p>
        <p class="text-[11px] text-rose-100">Total tagihan yang wajib Anda lunasi ke pembayar awal.</p>
      </div>
    </div>

    <!-- RINCIAN UTANG/PIUTANG PER ANGGOTA -->
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
      <h3 class="font-extrabold text-slate-800 text-base flex items-center gap-2">
        <i class="ri-user-unfollow-line text-indigo-600"></i> Rincian Tagihan Per Orang
      </h3>
      <div id="userSummaryBreakdown" class="divide-y divide-slate-100">
        <!-- Rendered by JS -->
      </div>
    </div>
  </main>

  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await checkAuthAndProtect();
      if (!user) return;

      renderSidebar('dashboard');
      await loadDashboardSummary(user);
    });

    async function loadDashboardSummary(user) {
      const { data: expenses } = await db.from('expenses').select('*');
      const { data: payments } = await db.from('settlement_payments').select('*');

      let totalPiutang = 0;
      let totalUtang = 0;
      let breakdownMap = {};

      (expenses || []).forEach(exp => {
        const perOrang = exp.nominal / (exp.peserta_emails.length || 1);
        const pembayar = exp.pembayar_email.toLowerCase();

        exp.peserta_emails.forEach(pEmail => {
          const peserta = pEmail.toLowerCase();
          if (peserta !== pembayar) {
            // Cek status bayar
            const pay = (payments || []).find(p => p.expense_id === exp.id && p.dari_email.toLowerCase() === peserta);
            const isLunas = pay && pay.status === 'APPROVED';

            if (!isLunas) {
              if (pembayar === user.email.toLowerCase()) {
                // Saya adalah pembayar awal -> Ini PIUTANG saya
                totalPiutang += perOrang;
                if (!breakdownMap[peserta]) breakdownMap[peserta] = { piutang: 0, utang: 0 };
                breakdownMap[peserta].piutang += perOrang;
              } else if (peserta === user.email.toLowerCase()) {
                // Saya adalah peserta yang ikut -> Ini UTANG saya
                totalUtang += perOrang;
                if (!breakdownMap[pembayar]) breakdownMap[pembayar] = { piutang: 0, utang: 0 };
                breakdownMap[pembayar].utang += perOrang;
              }
            }
          }
        });
      });

      document.getElementById('userTotalPiutang').innerText = 'Rp ' + totalPiutang.toLocaleString('id-ID');
      document.getElementById('userTotalUtang').innerText = 'Rp ' + totalUtang.toLocaleString('id-ID');

      const container = document.getElementById('userSummaryBreakdown');
      const keys = Object.keys(breakdownMap);

      if (keys.length === 0) {
        container.innerHTML = `<p class="py-4 text-xs text-slate-400 italic">Anda tidak memiliki utang atau piutang aktif saat ini.</p>`;
        return;
      }

      container.innerHTML = keys.map(email => {
        const item = breakdownMap[email];
        const selisih = item.piutang - item.utang;

        return `
          <div class="py-3.5 flex items-center justify-between text-xs">
            <div>
              <p class="font-bold text-slate-800">${email}</p>
              <p class="text-[11px] text-slate-400">Piutang: Rp ${item.piutang.toLocaleString('id-ID')} | Utang: Rp ${item.utang.toLocaleString('id-ID')}</p>
            </div>
            <div class="text-right font-extrabold">
              ${selisih > 0 
                ? `<span class="text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">+ Menagih Rp ${selisih.toLocaleString('id-ID')}</span>`
                : selisih < 0 
                ? `<span class="text-rose-600 bg-rose-50 px-3 py-1 rounded-full">- Harus Bayar Rp ${Math.abs(selisih).toLocaleString('id-ID')}</span>`
                : `<span class="text-slate-500">Lunas / Impas</span>`}
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
