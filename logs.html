<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Logs - Expense Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#F4F6FA] flex min-h-screen font-sans text-slate-800">

  <!-- SIDEBAR CONTAINER -->
  <div id="sidebarContainer"></div>

  <!-- MAIN CONTENT -->
  <main class="flex-1 p-8 space-y-8 overflow-y-auto">
    <div class="border-b border-slate-200/80 pb-4">
      <h2 class="text-2xl font-black text-slate-900 tracking-tight">Log Aktivitas Sistem</h2>
      <p class="text-xs text-slate-400 mt-0.5">Jejak audit seluruh aksi pengguna di aplikasi</p>
    </div>

    <div class="bg-white p-7 rounded-[28px] border border-slate-200/70 ui-card-shadow">
      <div id="logsContainer" class="divide-y divide-slate-100"></div>
    </div>
  </main>

  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await checkAuthAndProtect();
      if (!user) return;

      renderSidebar('logs');
      await loadActivityLogs();
    });

    async function loadActivityLogs() {
      const { data: logs } = await db.from('activity_logs').select('*').order('created_at', { ascending: false });
      const container = document.getElementById('logsContainer');

      if (!logs || logs.length === 0) {
        container.innerHTML = `<p class="py-6 text-center text-xs text-slate-400 font-medium">Belum ada aktivitas tercatat.</p>`;
        return;
      }

      container.innerHTML = logs.map(l => `
        <div class="py-4 flex items-center justify-between text-xs">
          <div class="space-y-1">
            <span class="font-bold text-slate-900 text-sm">${l.user_email}</span>
            <p class="text-slate-500 font-medium">${l.details}</p>
          </div>
          <div class="text-right">
            <span class="px-3 py-1 bg-blue-50 text-blue-600 rounded-full font-extrabold text-[10px]">${l.action}</span>
            <p class="text-[10px] text-slate-400 font-medium mt-1">${new Date(l.created_at).toLocaleString('id-ID')}</p>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
