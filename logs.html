<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Logs - Expense Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 flex min-h-screen font-sans">

  <!-- SIDEBAR CONTAINER -->
  <div id="sidebarContainer"></div>

  <!-- MAIN CONTENT -->
  <main class="flex-1 p-8 space-y-6 overflow-y-auto">
    <div class="border-b pb-4 border-slate-200">
      <h2 class="text-2xl font-extrabold text-slate-900">Log Aktivitas Sistem</h2>
      <p class="text-xs text-slate-500">Riwayat jejak aktivitas pengguna di dalam aplikasi.</p>
    </div>

    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
      <div id="logsContainer" class="divide-y divide-slate-100"></div>
    </div>
  </main>

  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await checkAuthAndProtect();
      if (!user) return;

      renderSidebar('logs');
      await loadActivityLogs();
    });

    async function loadActivityLogs() {
      const { data: logs } = await db.from('activity_logs').select('*').order('created_at', { ascending: false });
      const container = document.getElementById('logsContainer');

      if (!logs || logs.length === 0) {
        container.innerHTML = `<p class="py-4 text-xs text-slate-400 italic">Belum ada aktivitas tercatat.</p>`;
        return;
      }

      container.innerHTML = logs.map(l => `
        <div class="py-3 flex items-center justify-between text-xs">
          <div class="space-y-0.5">
            <span class="font-bold text-slate-800">${l.user_email}</span>
            <p class="text-slate-500">${l.details}</p>
          </div>
          <div class="text-right">
            <span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded font-extrabold text-[10px]">${l.action}</span>
            <p class="text-[10px] text-slate-400 mt-0.5">${new Date(l.created_at).toLocaleString('id-ID')}</p>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
