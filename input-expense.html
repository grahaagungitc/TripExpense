<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Expense - Expense Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#F4F6FA] flex min-h-screen font-sans text-slate-800">

  <!-- SIDEBAR CONTAINER -->
  <div id="sidebarContainer"></div>

  <!-- MAIN CONTENT -->
  <main class="flex-1 p-8 space-y-8 overflow-y-auto">
    <div class="flex items-center justify-between border-b border-slate-200/80 pb-4">
      <div>
        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Input Expense Baru</h2>
        <p class="text-xs text-slate-400 mt-0.5">Mencatat item pengeluaran beserta pembayar & daftar anggotanya</p>
      </div>
    </div>

    <!-- FORM INPUT -->
    <section class="bg-white p-7 rounded-[28px] border border-slate-200/70 ui-card-shadow space-y-6">
      <form id="expenseForm" onsubmit="handleExpenseSubmit(event)" class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Judul Trip / Event</label>
            <select id="expTripSelect" onchange="onSelectTripChange()" required class="w-full px-4 py-3 text-xs border border-slate-200 rounded-2xl font-bold text-blue-600 focus:ring-2 focus:ring-blue-500 bg-slate-50/50 outline-none">
            </select>
          </div>
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Kategori Expense</label>
            <select id="expKategoriSelect" required class="w-full px-4 py-3 text-xs border border-slate-200 rounded-2xl font-semibold text-slate-700 focus:ring-2 focus:ring-blue-500 bg-slate-50/50 outline-none">
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
          <div class="md:col-span-2 space-y-1.5">
            <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Nama Item / Pengeluaran</label>
            <input type="text" id="expNamaItem" required placeholder="Misal: Bensin, Dinner, Tiket Masuk" class="w-full px-4 py-3 text-xs border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 bg-slate-50/50 outline-none font-medium">
          </div>
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Total Nominal (Rp)</label>
            <input type="number" id="expNominal" required placeholder="500000" class="w-full px-4 py-3 text-xs border border-slate-200 rounded-2xl font-extrabold text-slate-900 focus:ring-2 focus:ring-blue-500 bg-slate-50/50 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Pembayar Awal:</label>
            <select id="expPembayarSelect" required class="w-full px-4 py-3 text-xs border border-slate-200 rounded-2xl font-bold text-blue-600 focus:ring-2 focus:ring-blue-500 bg-slate-50/50 outline-none">
            </select>
          </div>
          <div class="space-y-1.5">
            <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Foto Struk / Nota</label>
            <input type="file" id="expBuktiFile" accept="image/*,application/pdf" class="w-full text-xs text-slate-500 border border-slate-200 rounded-2xl p-2 bg-slate-50/50">
          </div>
        </div>

        <div class="space-y-2.5 pt-3 border-t border-slate-100">
          <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Anggota Yang Ikut Menanggung:</label>
          <div id="expPesertaChecklist" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5"></div>
        </div>

        <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-2xl shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2">
          <i class="ri-save-line text-sm"></i> Simpan Sub-Expense
        </button>
      </form>
    </section>

    <!-- LOG HISTORI -->
    <section class="bg-white p-7 rounded-[28px] border border-slate-200/70 ui-card-shadow space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-4">
        <h3 class="font-extrabold text-slate-900 text-base">Log Transaksi Sub-Expense</h3>
        <span class="px-3 py-1 bg-blue-50 text-blue-600 rounded-full font-extrabold text-xs" id="totalSubExpenseCount">0 Transaksi</span>
      </div>
      <div id="expenseLogContainer" class="divide-y divide-slate-100"></div>
    </section>
  </main>

  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script>
    let pageData = { users: [], trips: [], categories: [], expenses: [] };

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await checkAuthAndProtect();
      if (!user) return;

      renderSidebar('expense');
      await loadPageData();
    });

    async function loadPageData() {
      const { data: users } = await db.from('users').select('*');
      const { data: trips } = await db.from('trips').select('*').order('created_at', { ascending: true });
      const { data: categories } = await db.from('categories').select('*').order('nama', { ascending: true });
      const { data: expenses } = await db.from('expenses').select('*').order('created_at', { ascending: false });

      pageData = { users: users || [], trips: trips || [], categories: categories || [], expenses: expenses || [] };

      document.getElementById('expTripSelect').innerHTML = pageData.trips.map(t => `<option value="${t.id}">${t.judul}</option>`).join('');
      document.getElementById('expKategoriSelect').innerHTML = pageData.categories.map(c => `<option value="${c.nama}">${c.nama}</option>`).join('');
      document.getElementById('expPembayarSelect').innerHTML = pageData.users.map(u => `
        <option value="${u.email}" ${u.email.toLowerCase() === currentUser.email.toLowerCase() ? 'selected' : ''}>${u.nama} (${u.email})</option>
      `).join('');

      onSelectTripChange();
      renderExpenseLogs();
    }

    function onSelectTripChange() {
      const selectedTripId = document.getElementById('expTripSelect').value;
      const targetTrip = pageData.trips.find(t => t.id === selectedTripId);
      const activeEmails = targetTrip ? (targetTrip.active_participant_emails || []) : [];

      const eligibleUsers = activeEmails.length > 0 
        ? pageData.users.filter(u => activeEmails.includes(u.email))
        : pageData.users;

      document.getElementById('expPesertaChecklist').innerHTML = eligibleUsers.map(u => `
        <label class="flex items-center p-3 bg-slate-50 border border-slate-200/80 rounded-2xl cursor-pointer hover:bg-blue-50/50 transition">
          <input type="checkbox" value="${u.email}" checked class="exp-chk-peserta w-4 h-4 text-blue-600 rounded">
          <span class="ml-2.5 text-xs font-semibold text-slate-700 truncate">${u.nama}</span>
        </label>
      `).join('');
    }

    async function handleExpenseSubmit(e) {
      e.preventDefault();
      const selectedPeserta = Array.from(document.querySelectorAll('.exp-chk-peserta:checked')).map(c => c.value);
      if (!selectedPeserta.length) return alert('Pilih minimal 1 peserta!');

      const tripId = document.getElementById('expTripSelect').value;
      const kategori = document.getElementById('expKategoriSelect').value;
      const item = document.getElementById('expNamaItem').value;
      const nominal = parseFloat(document.getElementById('expNominal').value);
      const pembayarEmail = document.getElementById('expPembayarSelect').value;
      const fileInput = document.getElementById('expBuktiFile');

      let buktiUrl = '';
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const fileName = `${Date.now()}_${file.name}`;
        const { data } = await db.storage.from('receipts').upload(fileName, file);
        if (data) {
          const { data: pubData } = db.storage.from('receipts').getPublicUrl(fileName);
          buktiUrl = pubData.publicUrl;
        }
      }

      const { error } = await db.from('expenses').insert([{
        trip_id: tripId, kategori, nama_item: item, nominal, pembayar_email: pembayarEmail, peserta_emails: selectedPeserta, bukti_url: buktiUrl
      }]);

      if (error) return alert('Gagal menyimpan: ' + error.message);

      await db.from('activity_logs').insert([{
        user_email: currentUser.email,
        action: 'CREATE_EXPENSE',
        details: `Menambahkan sub-expense "${item}" senilai Rp ${nominal.toLocaleString('id-ID')}`
      }]);

      alert('Sub-expense berhasil dicatat!');
      document.getElementById('expenseForm').reset();
      await loadPageData();
    }

    function renderExpenseLogs() {
      document.getElementById('totalSubExpenseCount').innerText = `${pageData.expenses.length} Transaksi`;
      const container = document.getElementById('expenseLogContainer');

      if (!pageData.expenses.length) {
        container.innerHTML = `<p class="py-6 text-center text-xs text-slate-400 font-medium">Belum ada riwayat transaksi.</p>`;
        return;
      }

      container.innerHTML = pageData.expenses.map(e => `
        <div class="py-4 flex items-center justify-between text-xs">
          <div>
            <span class="px-2.5 py-0.5 bg-blue-50 text-blue-600 rounded-full font-extrabold text-[10px]">${e.kategori || 'Umum'}</span>
            <p class="font-bold text-slate-900 mt-1 text-sm">${e.nama_item}</p>
            <p class="text-slate-400 text-[11px] font-medium mt-0.5">Dibayar oleh: <strong>${e.pembayar_email}</strong> • ${e.peserta_emails.length} Peserta</p>
          </div>
          <div class="text-right">
            <p class="font-extrabold text-slate-900 text-sm">Rp ${parseFloat(e.nominal).toLocaleString('id-ID')}</p>
            ${e.bukti_url ? `<a href="${e.bukti_url}" target="_blank" class="text-blue-600 font-bold hover:underline text-[10px] inline-block mt-0.5">Lihat Struk</a>` : ''}
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
